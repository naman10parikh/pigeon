name: pigeon RSI

# pigeon's recursive-self-improvement loop (PLAN §11). Two halves:
#   1. deterministic ($0, tokenless) — golden-eval regression + dsip conformance. Runs here, nightly + on demand.
#   2. Claude proposal (gated) — workflows/rsi.workflow.js, needs CLAUDE_CODE_OAUTH_TOKEN (chairman checklist D8).
# Until the token is present, only the deterministic half runs — so this workflow is always green.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *" # 08:23 UTC nightly — staggered off the health-check (09:17)

permissions:
  contents: read

jobs:
  deterministic:
    uses: ./.github/workflows/rsi-reusable.yml
